<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
  <title id="title">Lab 4. 사전 학습한 FourCastNet의 예측과 검증 절차</title>
  <desc id="desc">노트북에서 run_forecast.py를 실행한다. load_initial은 ERA5 초기 상태를 읽고 load_model은 미리 정한 PhysicsNeMo AFNO 체크포인트와 학습 시 저장한 정규화 통계를 읽는다. torch.inference_mode에서 입력을 정규화하고 AFNO를 실행한 뒤 원래 단위로 환산하는 과정을 여덟 번 반복한다. 각 단계에서는 예측 변수 26개 전체를 다음 입력으로 쓰며, 이 중 4개만 forecast.npz에 저장한다. 검증 단계에서는 해당 파일과 미래 시점 ERA5 재분석값을 비교하며, 초기 상태가 그대로 지속된다고 가정한 기준 예보와도 성능을 비교한다. 모델 가중치는 고정되며 역전파, PINN 잔차, 최적화 단계는 없다.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526573"/></marker><marker id="loop" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147d72"/></marker></defs>
  <rect width="1200" height="1020" fill="#ffffff"/>
  <g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans CJK KR, sans-serif" fill="#172c3c">
    <text x="44" y="54" font-size="32" font-weight="700">Lab 4 · FourCastNet으로 날씨를 예측하고 오차 확인하기</text>
    <text x="44" y="94" font-size="22" fill="#526573">노트북의 run_script()가 run_forecast.py의 main()을 실행합니다.</text>
    <rect x="44" y="129" width="400" height="113" rx="12" fill="#eef5fb" stroke="#2269a8" stroke-width="2"/>
    <text x="64" y="163" font-size="24" font-weight="700" fill="#2269a8">load_initial(initial.npz)</text>
    <text x="64" y="198" font-size="22">ERA5의 초기 대기 상태</text>
    <text x="64" y="229" font-size="20" fill="#526573">변수 26개, 원래 물리 단위, FP32</text>
    <rect x="575" y="129" width="580" height="113" rx="12" fill="#f2eef8" stroke="#7658a3" stroke-width="2"/>
    <text x="597" y="163" font-size="24" font-weight="700" fill="#7658a3">load_model(model_dir, device)</text>
    <text x="597" y="198" font-size="22">AFNO.from_checkpoint(...).eval()</text>
    <text x="597" y="229" font-size="20" fill="#526573">저장한 모델 가중치와 학습 데이터의 평균·표준편차</text>
    <path d="M155 242V319M715 242V319" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="44" y="275" width="478" height="32" fill="#ffffff"/>
    <text x="44" y="299" font-size="22" font-weight="700">torch.inference_mode()에서 여덟 번 반복</text>
    <g stroke-width="2">
      <rect x="44" y="327" width="215" height="130" rx="12" fill="#eef5fb" stroke="#2269a8"/>
      <rect x="300" y="327" width="245" height="130" rx="12" fill="#f2eef8" stroke="#7658a3"/>
      <rect x="586" y="327" width="250" height="130" rx="12" fill="#eaf6f3" stroke="#147d72"/>
      <rect x="877" y="327" width="278" height="130" rx="12" fill="#f2eef8" stroke="#7658a3"/>
    </g>
    <text x="64" y="365" font-size="23" font-weight="700">현재 대기 상태</text><text x="64" y="401" font-size="22">전 지구 변수 26개</text><text x="64" y="436" font-size="20" fill="#526573">원래 물리 단위</text>
    <text x="320" y="365" font-size="23" font-weight="700">정규화</text><text x="320" y="401" font-size="22">(현재 값 − 평균)</text><text x="320" y="436" font-size="22">÷ 표준편차</text>
    <text x="606" y="365" font-size="23" font-weight="700" fill="#147d72">PhysicsNeMo</text><text x="606" y="401" font-size="22">AFNO model(...)</text><text x="606" y="436" font-size="20" fill="#526573">격자 전체 예측</text>
    <text x="897" y="365" font-size="23" font-weight="700">원래 단위로 환산</text><text x="897" y="401" font-size="22">출력 × 표준편차 + 평균</text><text x="897" y="436" font-size="20" fill="#526573">6시간 뒤 대기 상태</text>
    <g fill="none" stroke="#526573" stroke-width="2.5"><path d="M259 390H293" marker-end="url(#arrow)"/><path d="M545 390H579" marker-end="url(#arrow)"/><path d="M836 390H870" marker-end="url(#arrow)"/></g>
    <path d="M1017 457V516H155V464" fill="none" stroke="#147d72" stroke-width="3" marker-end="url(#loop)"/>
    <rect x="278" y="498" width="625" height="38" fill="#ffffff"/>
    <text x="590" y="524" font-size="22" fill="#147d72" text-anchor="middle">다음 입력은 방금 예측한 변수 26개입니다. 모델 가중치는 고정합니다.</text>
    <path d="M1017 516V584H832" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="44" y="552" width="773" height="112" rx="12" fill="#eef5fb" stroke="#2269a8" stroke-width="2"/>
    <text x="64" y="589" font-size="24" font-weight="700">forecast.npz</text>
    <text x="64" y="624" font-size="22">0시간부터 48시간까지 6시간 간격으로 u10m, v10m, msl, t2m 저장</text>
    <text x="64" y="653" font-size="20" fill="#526573">다음 단계에 쓰는 변수 26개 중 검증할 4개를 저장합니다.</text>
    <path d="M430 664V724" fill="none" stroke="#526573" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="870" y="628" width="285" height="133" rx="12" fill="#fff4e8" stroke="#bd6416" stroke-width="2"/>
    <text x="890" y="665" font-size="24" font-weight="700" fill="#bd6416">truth.npz</text><text x="890" y="703" font-size="22">같은 시각의 ERA5 자료</text><text x="890" y="738" font-size="20" fill="#526573">검증할 때 사용</text>
    <path d="M1012 761V800H833" fill="none" stroke="#bd6416" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="44" y="733" width="773" height="167" rx="12" fill="#f5f7f9" stroke="#526573" stroke-width="2"/>
    <text x="64" y="770" font-size="24" font-weight="700">evaluate_weather.py</text>
    <text x="64" y="807" font-size="22">load_pair() → evaluate() → plot_maps() / save_gif()</text>
    <text x="64" y="844" font-size="22">모델 예보와 지속 예보의 오차를 각각 ERA5 재분석값을 기준으로 계산</text>
    <text x="64" y="880" font-size="20" fill="#526573">전 지구와 동아시아에서 6~48시간 예보의 면적 가중 RMSE 계산</text>
    <rect x="44" y="926" width="1111" height="60" rx="10" fill="#eaf6f3"/>
    <text x="600" y="965" font-size="23" font-weight="700" fill="#147d72" text-anchor="middle">이미 학습한 가중치로 예측하므로 역전파나 최적화, PINN 잔차 계산은 생략합니다.</text>
  </g>
</svg>
